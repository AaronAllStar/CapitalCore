[workspace]
resolver = "2"
members = [
    "crates/edge-core",
    "crates/edge-domain",
    "crates/edge-events",
    "crates/edge-audit",
    "crates/edge-bench",
    "crates/edge-storage",
    "crates/edge-auth",
    "crates/edge-observability",
    "crates/edge-security",
    "crates/edge-transactions",
    "crates/edge-rules",
    "crates/edge-features",
    "crates/edge-decision",
    "crates/edge-api",
    "crates/edge-workers",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["EdgeArena Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", default-features = false, features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "alloc"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
base64 = "0.22"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
axum = { version = "0.7", default-features = false, features = ["tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.5", default-features = false, features = ["trace", "cors"] }
proptest = "1.4"

