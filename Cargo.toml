[workspace]
resolver = "2"
members = [
    "crates/edge-core",
    "crates/edge-domain",
    "crates/edge-events",
    "crates/edge-audit",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["EdgeArena Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", default-features = false, features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "alloc"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
proptest = "1.4"

