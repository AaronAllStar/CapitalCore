# EdgeArena Zero-Command Unified Local & Production Stack
version: "3.8"

services:
  edge-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgearena/edge-api:latest
    container_name: edge-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      RUST_LOG: info,edge_api=debug,edge_decision=info
      DATABASE_URL: postgres://edgearena:edgearena@postgres:5432/edgearena
      JWT_SECRET_SEED: ${JWT_SECRET_SEED:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/edge-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  edge-web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    image: edgearena/edge-web:latest
    container_name: edge-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://edge-api:8080
    depends_on:
      edge-api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgearena
      POSTGRES_PASSWORD: edgearena
      POSTGRES_DB: edgearena
    ports:
      - "5432:5432"
    volumes:
      - edge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgearena -d edgearena"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  edge_pgdata:
    driver: local
