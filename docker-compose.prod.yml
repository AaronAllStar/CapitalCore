# CapitalCore Production Full-Stack Container (PostgreSQL 15 + Rust API + Next.js Web)
version: "3.8"

services:
  capitalcore:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    image: capitalcore-all-in-one:latest
    container_name: capitalcore-unified-prod
    restart: always
    ports:
      - "3001:3001"
      - "8001:8001"
    environment:
      APP_ENV: production
      PORT: 8001
      WEB_PORT: 3001
      HOST: 0.0.0.0
      RUST_LOG: info,edge_api=info,edge_decision=info
      JWT_SECRET_SEED: ${JWT_SECRET_SEED:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8001/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
